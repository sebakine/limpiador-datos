[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "limpiador-datos"
version = "0.1.0"
description = "Limpia y valida archivos CSV/Excel con datos de Chile: RUT, teléfonos, emails, fechas y montos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastián Muñoz" }]
requires-python = ">=3.11"
keywords = ["limpieza de datos", "data cleaning", "csv", "excel", "pandas", "rut", "chile"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "typer>=0.15",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
ejemplos = ["faker>=30"]

[project.scripts]
limpiador = "limpiador.cli:app"

[project.urls]
Repository = "https://github.com/sebakine/limpiador-datos"
Issues = "https://github.com/sebakine/limpiador-datos/issues"

[dependency-groups]
dev = [
    "faker>=30",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/limpiador"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=limpiador --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["limpiador"]

[tool.coverage.report]
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "PERF"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "PLR0917", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
"src/limpiador/report.py" = ["E501"]  # plantilla HTML

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "faker.*"]
ignore_missing_imports = true
